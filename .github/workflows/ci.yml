name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: 构建
        run: dotnet build Kleaner.slnx -c Release
      - name: 测试
        run: dotnet test tests/Kleaner.Core.Tests -c Release --no-build
