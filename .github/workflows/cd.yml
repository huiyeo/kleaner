name: CD

# 打 v* 标签（或手动触发）自动构建发行版四件套并发布 GitHub Release。
# 注意：规则渠道（rules-channel）的签名发布不在此处——私钥只在所有者机器，
# 流程见 docs/release-checklist.md 3b 节。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v 前缀，如 1.2.0；带 - 后缀自动标记为预发布）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 计算版本号
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步程序集版本（消除 v1.1.0 的手工同步坑）
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $v = $env:VERSION
          $numver = ($v -replace '-.*$', '')
          if ($numver -match '^\d+\.\d+\.\d+$') { $numver = "$numver.0" }
          $p = 'src/Kleaner.App/Kleaner.App.csproj'
          $t = Get-Content $p -Raw
          $t = $t -replace '<AssemblyVersion>[^<]*</AssemblyVersion>', "<AssemblyVersion>$numver</AssemblyVersion>"
          $t = $t -replace '<InformationalVersion>[^<]*</InformationalVersion>', "<InformationalVersion>$v</InformationalVersion>"
          Set-Content $p $t -NoNewline -Encoding UTF8
          Write-Host "AssemblyVersion=$numver InformationalVersion=$v"

      - name: 安装 Velopack CLI
        run: dotnet tool install -g vpk

      - name: 发布门禁（完整测试）
        run: dotnet test tests/Kleaner.Core.Tests -c Release

      - name: 发布打包（release.sh：自包含散文件 + Velopack 四件套）
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          bash scripts/release.sh "$VERSION"

      - name: 记录产物 SHA512
        shell: bash
        run: |
          cd releases
          sha512sum Kleaner-win-Setup.exe Kleaner-win-Portable.zip RELEASES Kleaner-*-full.nupkg > SHA512.txt
          cat SHA512.txt

      - name: 发布 GitHub Release（失败自动重试，规避 API 偶发 5xx）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # 幂等：标签上已有带资产的 Release（如重跑/恢复过的）视为完成，跳过创建
          if gh release view "$TAG" --json assets --jq 'any(.assets[]; true)' 2>/dev/null | grep -q true; then
            echo "Release $TAG 已存在且带资产，跳过创建。"
            exit 0
          fi
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease";; esac
          for attempt in 1 2 3; do
            if gh release create "$TAG" \
              --title "Kleaner $VERSION" \
              --notes "自动构建（CD）。SHA512 见附件 SHA512.txt。发布说明与验证记录由维护者依据 docs/release-checklist.md 补充。应用未签名，SmartScreen「未知发布者」提示属预期。" \
              $PRERELEASE \
              releases/Kleaner-win-Setup.exe releases/Kleaner-win-Portable.zip releases/RELEASES releases/Kleaner-*-full.nupkg releases/SHA512.txt; then
              exit 0
            fi
            echo "第 $attempt 次创建 Release 失败，15 秒后重试…"
            # gh create 失败会留下草稿态 Release 占用标签——只删 Release，保留 git 标签（必须留在构建提交上）
            gh release delete "$TAG" --yes 2>/dev/null || true
            sleep 15
          done
          exit 1
